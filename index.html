<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso - Rosso Materiales</title>

  <!-- CSS -->
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">

  <style>
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>

<body>

  <!-- Hero con fondo -->
  <section id="hero" class="d-flex justify-content-center align-items-center">

    <div class="container">
      <div class="row justify-content-center">
        <!-- CARD DE LOGIN -->
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
          <div class="login-card" data-aos="zoom-in">
            <h4 class="text-center mb-4">Acceso al Portal Rosso</h4>
            <form onsubmit="return login(event)">
              <div class="mb-3">
                <label class="form-label">Correo institucional</label>
                <input type="email" class="form-control" id="email" placeholder="tu@correo.com.ar" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Ingresar</button>
              <p id="error" class="text-danger mt-3 text-center"></p>
            </form>
          </div>
        </div>
  
      </div>
    </div>
  </section>
  

  <!-- JS -->
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/typed.js/typed.umd.js"></script>
  <script src="assets/vendor/waypoints/noframework.waypoints.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>
  <script src="assets/js/main.js"></script>

  <!-- Validación -->
  <script>
    function login(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const errorText = document.getElementById("error");

      if (email.endsWith("@rossomateriales.com.ar")) {
        window.location.href = "index.html";
      } else {
        errorText.innerText = "Solo se permite el acceso con correos de rossomateriales.com.ar";
      }
    }
  </script>

</body>
</html>
